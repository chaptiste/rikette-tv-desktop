[package]
name = "rikette-capture"
description = "Rikette's capture process: owns libobs and keeps the replay buffer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
capture-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
# libobs-rs's FFI layer, pinned to the OBS release that scripts/obs-runtime.mjs bundles.
libobs = "=5.0.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
