[workspace]
resolver = "2"
members = ["src-tauri", "capture", "capture-protocol"]

[workspace.package]
version = "0.1.33"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Rikette"]

[workspace.dependencies]
capture-protocol = { path = "capture-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
windows = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
