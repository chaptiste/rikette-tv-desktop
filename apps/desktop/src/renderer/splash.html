<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Rikette</title>
    <style>
      /* Same palette as src/styles/globals.css. */
      :root {
        --background: #1a1b26;
        --foreground: #c0caf5;
        --muted-foreground: #8b93b8;
        --secondary: #24283b;
        --border: #2a2e42;
        --primary: #7aa2f7;
        --rec: #f7768e;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        user-select: none;
        font-family: 'Geist Variable', 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-app-region: drag;
      }
      body {
        display: flex;
        box-sizing: border-box;
        flex-direction: column;
        justify-content: flex-end;
        gap: 12px;
        padding: 28px;
        border: 1px solid var(--border);
      }
      .logo {
        width: 52px;
        height: 52px;
        margin-bottom: auto;
      }
      .brand {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .status {
        min-height: 14px;
        color: var(--muted-foreground);
        font-family: 'JetBrains Mono Variable', Consolas, monospace;
        font-size: 10.5px;
        line-height: 14px;
        text-transform: uppercase;
      }
      .status::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 8px;
        background: var(--rec);
        vertical-align: 1px;
        animation: blink 1.6s steps(1, end) infinite;
      }
      .track {
        position: relative;
        width: 100%;
        height: 4px;
        overflow: hidden;
        background: var(--secondary);
      }
      .fill {
        width: 0;
        height: 100%;
        background: var(--primary);
        transition: width 200ms linear;
      }
      /* No known percentage yet: a short bar slides across the track. */
      .track.busy .fill {
        width: 30%;
        animation: slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
      @keyframes blink {
        0%,
        70% {
          opacity: 1;
        }
        70.01%,
        100% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .status::before {
          animation: none;
        }
        .fill {
          transition: none;
        }
        .track.busy .fill {
          width: 100%;
          animation: none;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="./src/assets/logo.png" alt="" draggable="false" />
    <span class="brand">Rikette</span>
    <span class="status" role="status" aria-live="polite">Checking for updates…</span>
    <div class="track busy" aria-hidden="true"><div class="fill"></div></div>
    <script type="module" src="./splash.ts"></script>
  </body>
</html>
