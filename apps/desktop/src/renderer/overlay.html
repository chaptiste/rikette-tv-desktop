<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Rikette overlay</title>
    <style>
      /* Same Instant replay palette as src/styles/globals.css. */
      :root {
        --popover: #111a2c;
        --foreground: #e9edf6;
        --muted-foreground: #7f8bab;
        --primary: #2f6bff;
        --rec: #ff2d3f;
        --display: 'Archivo Variable', 'Segoe UI', sans-serif;
        --mono: 'Martian Mono Variable', 'Cascadia Mono', monospace;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: var(--display);
        -webkit-font-smoothing: antialiased;
      }
      /* A TV lower third: a red REPLAY block, then the panel wipes open behind a blue bar. */
      #toast {
        display: flex;
        align-items: stretch;
        box-sizing: border-box;
        width: max-content;
        min-width: 250px;
        max-width: calc(100vw - 32px);
        height: 56px;
        margin: 12px auto 0;
        opacity: 0;
        clip-path: inset(0 100% 0 0);
        transition:
          clip-path 320ms cubic-bezier(0.65, 0, 0.35, 1),
          opacity 120ms linear;
      }
      #toast.show {
        opacity: 1;
        clip-path: inset(0 0 0 0);
      }
      .tag {
        display: grid;
        place-items: center;
        padding: 0 12px;
        background: var(--rec);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        font-stretch: 75%;
        letter-spacing: 0.05em;
      }
      .panel {
        position: relative;
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        padding: 0 18px 0 14px;
        overflow: hidden;
        background: var(--popover);
        box-shadow: inset 0 -2px 0 var(--primary);
      }
      .brand {
        color: var(--muted-foreground);
        font-family: var(--mono);
        font-stretch: 87.5%;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.04em;
        line-height: 12px;
        text-transform: uppercase;
      }
      .label {
        overflow: hidden;
        color: var(--foreground);
        font-size: 22px;
        font-weight: 800;
        font-stretch: 72%;
        line-height: 24px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* the blue bar that leads the wipe */
      .panel::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 6px;
        background: var(--primary);
        transform: translateX(-10px);
      }
      #toast.show .panel::after {
        animation: sweep 520ms 60ms cubic-bezier(0.65, 0, 0.35, 1) both;
      }
      @keyframes sweep {
        from {
          transform: translateX(-10px);
        }
        to {
          transform: translateX(400px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #toast {
          clip-path: none;
          transition: opacity 120ms linear;
        }
        #toast.show .panel::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="tag" aria-hidden="true">REPLAY</div>
      <div class="panel">
        <span class="brand">Rikette · saved to clips</span>
        <span class="label">Clip Saved</span>
      </div>
    </div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
